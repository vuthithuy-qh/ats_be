server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: job-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/jobs/**

        - id: candidate-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/candidates/**

        - id: application-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/applications/**
